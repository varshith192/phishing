<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Website Safety Detection System</title>

<style>
* {
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    display: flex;
    justify-content: center;
    align-items: center;
    color: #ffffff;
}

.app {
    width: 850px;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(12px);
    border-radius: 18px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.6);
    padding: 30px;
    display: flex;
    flex-direction: column;
    gap: 25px;
    animation: fadeIn 0.8s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header h1 {
    margin: 0;
    color: #00e5ff;
    letter-spacing: 0.5px;
}

.badge {
    background: rgba(0,229,255,0.15);
    color: #00e5ff;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
}

.input-box {
    display: flex;
    gap: 12px;
}

.input-box input {
    flex: 1;
    padding: 14px;
    border-radius: 10px;
    border: none;
    outline: none;
    font-size: 15px;
}

.input-box button {
    padding: 14px 22px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, #00e5ff, #00b0ff);
    color: #003b4f;
    font-weight: bold;
    cursor: pointer;
}

.result-grid {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

.status-card, .info-card {
    background: rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 20px;
    animation: slideUp 0.6s ease;
}

.status-card {
    flex: 1;
}

.info-card {
    flex: 2;
}

.safe {
    color: #2cff9b;
    font-weight: bold;
}

.unsafe {
    color: #ff5c5c;
    font-weight: bold;
}

/* Footer */
.footer {
    text-align: center;
    font-size: 12px;
    color: #b0bec5;
}

.footer a {
    color: white;
    text-decoration: none;
}

.footer a:hover {
    text-decoration: underline;
}
</style>
</head>

<body>
<div class="app">

    <div class="header">
        <h1>Website Phishing Safety Detection System</h1>
        
    </div>

    <form class="input-box" id="form">
        <input type="text" name="url" placeholder="Enter website URL (example.com)" required>
        <button type="submit">Analyze</button>
    </form>

    <div class="result-grid" id="results" style="display:none;">
        <div class="status-card">
            <span>Status</span>
            <div id="status"></div>
            <div id="confidence"></div>
        </div>
        <div class="info-card">
            <div id="ip"></div>
            <div id="country"></div>
            <div id="isp"></div>
            <div id="domain_age"></div>
        </div>
    </div>

    <div class="footer">
        Contact:
        <a href="mailto:varshithdhara@gmail.com">varshithdhara@gmail.com</a>
    </div>

</div>

<script>
document.getElementById("form").addEventListener("submit", async function(e){
    e.preventDefault();
    const formData = new FormData(this);
    const res = await fetch("/check", { method: "POST", body: formData });
    const data = await res.json();

    document.getElementById("results").style.display = "flex";

    const statusEl = document.getElementById("status");
    statusEl.textContent = data.result;
    statusEl.className = data.result.includes("SAFE") ? "safe" : "unsafe";

    document.getElementById("confidence").textContent =
        data.confidence ? "Confidence: " + data.confidence + "%" : "";

    document.getElementById("ip").textContent =
        data.ip ? "IP: " + data.ip : "";

    document.getElementById("country").textContent =
        data.country ? "Country: " + data.country : "";

    document.getElementById("isp").textContent =
        data.isp ? "Hosting: " + data.isp : "";

    document.getElementById("domain_age").textContent =
        data.domain_age ? "Domain Age: " + data.domain_age : "";
});
</script>

</body>
</html>
